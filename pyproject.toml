[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "mp4-recovery"
version = "0.1.0"
description = "Fall recovery for the Mini Pupper v4: get-up training, evaluation and deployment"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Apache-2.0" }
# Shared by both modes. Backend-specific packages and every version pin live
# in requirements/ and are installed by scripts/install/.
dependencies = [
    "numpy",
    "torch",
]


[tool.hatch.build.targets.wheel]
packages = ["src/mp4_recovery"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100
# Vendored upstream code; kept diffable against its source.
extend-exclude = ["src/mp4_recovery/actuators/bam"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# Physics notation (I for inertia, l for link).
"tools/*" = ["E741"]
